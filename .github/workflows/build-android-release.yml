name: Build Signed Android Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean install and force Linux Tailwind Binding
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --force
          npm install @tailwindcss/oxide --force

      - name: Build web project
        run: npm run build

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Capacitor Android Platform & Inject Google Auth Config
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # نسخ ملف google-services.json تلقائياً إذا كان موجوداً في المشروع
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          # حقن المفتاح الثابت server_client_id داخل strings.xml تلقائياً
          sed -i 's|</resources>|    <string name="server_client_id">215148796185-e5gae926ms56t6vtgmt0hdlah12s8s6i.apps.googleusercontent.com</string>\n</resources>|g' android/app/src/main/res/values/strings.xml

          # رفع minSdkVersion من 22 إلى 24 لتلبية متطلبات الحماية التلقائية في Google Play
          sed -i 's/minSdkVersion = 22/minSdkVersion = 24/g' android/variables.gradle
          sed -i 's/minSdkVersion 22/minSdkVersion 24/g' android/app/build.gradle

          npx cap sync android
          
          # رفع رقم الإصدار تلقائياً بناءً على رقم عملية البناء حتى لا يتكرر أبداً في جوجل بلاي
          VERSION_CODE=$((15 + ${{ github.run_number }}))
          sed -i "s/versionCode 1/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.$VERSION_CODE\"/g" android/app/build.gradle

      - name: Create or Reuse Permanent Keystore
        run: |
          if [ ! -f "jaknooma-release-key.jks" ]; then
            echo "Creating permanent keystore for the first and last time..."
            keytool -genkey -v -keystore jaknooma-release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias jaknooma-alias -storepass jaknooma123 -keypass jaknooma123 -dname "CN=Jaknooma, OU=Dev, O=Jaknooma, L=Dubai, S=Dubai, C=AE"
            
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add -f jaknooma-release-key.jks
            git commit -m "chore: save permanent Android keystore [skip ci]"
            git push
          else
            echo "Using existing permanent keystore from repository!"
          fi

          cp jaknooma-release-key.jks android/app/jaknooma-release-key.jks

          echo "========== PERMANENT SHA-1 FOR FIREBASE =========="
          keytool -list -v -keystore android/app/jaknooma-release-key.jks -alias jaknooma-alias -storepass jaknooma123 | grep -E "SHA1:|SHA-256:"
          echo "=================================================="

      - name: Build Signed AAB & APK
        run: |
          echo "
          android {
              signingConfigs {
                  release {
                      storeFile file('jaknooma-release-key.jks')
                      storePassword 'jaknooma123'
                      keyAlias 'jaknooma-alias'
                      keyPassword 'jaknooma123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          " >> android/app/build.gradle

          cd android
          ./gradlew bundleRelease assembleRelease

      - name: Upload Signed AAB, APK & Certificate PEM
        run: |
          keytool -export -rfc -keystore jaknooma-release-key.jks -alias jaknooma-alias -file upload_certificate.pem -storepass jaknooma123
        
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-play-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            jaknooma-release-key.jks
            upload_certificate.pem
