name: Build Signed Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Purge ALL existing keystores in repository
        run: |
          find . -name "*.jks" -type f -delete
          find . -name "*.keystore" -type f -delete
          rm -rf ~/.android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean install and force Linux Tailwind Binding
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --force
          npm install @tailwindcss/oxide --force

      - name: Build web project
        run: npm run build

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Capacitor Android Platform & Inject Google Auth Config
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          sed -i 's|</resources>|    <string name="server_client_id">215148796185-e5gae926ms56t6vtgmt0hdlah12s8s6i.apps.googleusercontent.com</string>\n</resources>|g' android/app/src/main/res/values/strings.xml

          npx cap sync android

          sed -i -E 's/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = 24/g' android/variables.gradle
          sed -i -E 's/minSdkVersion\s+rootProject\.ext\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle

      - name: Decode keystore strictly from GitHub Secrets
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/jaknooma-release-key.jks

      - name: Build, Strip Old Signatures, and Force-Sign with 24:2C:9B
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((50 + ${{ github.run_number }}))

          sed -i -E "s/versionCode\s+[0-9]+/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"1.0.$VERSION_CODE\"/g" android/app/build.gradle

          # استخراج الاسم الحقيقي للـ Alias أوتوماتيكياً من داخل ملف المفتاح نفسه لمنع أي خطأ
          ACTUAL_ALIAS=$(keytool -list -v -keystore android/app/jaknooma-release-key.jks -storepass "$KEYSTORE_PASSWORD" | grep "Alias name:" | head -n 1 | awk '{print $3}')
          echo "Detected Keystore Alias: $ACTUAL_ALIAS"

          cd android
          ./gradlew bundleRelease

          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"

          # 1. مسح أي توقيع سابق داخل ملف الـ AAB نهائياً (حذف ملفات التوقيع من META-INF)
          zip -d "$AAB_PATH" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/*.EC" "META-INF/*.SF" || true

          # 2. توقيع ملف الـ AAB الخام بمفتاح 24:2C:9B حصرياً
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/jaknooma-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$ACTUAL_ALIAS"

          # 3. فحص صارم لبصمة ملف الـ AAB نفسه بعد التوقيع
          echo "=== فحص شهادة ملف الـ AAB النهائي ==="
          CERT_OUTPUT=$(keytool -printcert -jarfile "$AAB_PATH")
          echo "$CERT_OUTPUT"

          if echo "$CERT_OUTPUT" | grep -q "24:2C:9B:F3:C4:93:6B:79:D4:53:F8:20:47:B8:06:1D:C8:92:11:A6"; then
            echo "✅ تم التأكد 100%: ملف الـ AAB موقع بالبصمة الصحيحة 24:2C:9B فقط!"
          else
            echo "❌ خطأ: البصمة لا تطابق 24:2C:9B!"
            exit 1
          fi

          if echo "$CERT_OUTPUT" | grep -q "C6:F6:20:40"; then
            echo "❌ خطأ: البصمة الخاطئة C6:F6 لا زالت موجودة!"
            exit 1
          fi

          cp "$AAB_PATH" "app/build/outputs/bundle/release/jaknooma-pure-242C-run-${{ github.run_number }}.aab"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jaknooma-pure-242C-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/jaknooma-pure-242C-run-*.aab
