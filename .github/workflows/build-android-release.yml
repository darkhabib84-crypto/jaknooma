name: Build Signed Android Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove any repo keystore to prevent conflicts
        run: |
          rm -f *.jks *.keystore
          rm -f android/app/*.jks android/app/*.keystore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean install and force Linux Tailwind Binding
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          npm install --force
          npm install @tailwindcss/oxide --force

      - name: Build web project
        run: npm run build

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Add Capacitor Android Platform & Inject Google Auth Config
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          sed -i 's|</resources>|    <string name="server_client_id">215148796185-e5gae926ms56t6vtgmt0hdlah12s8s6i.apps.googleusercontent.com</string>\n</resources>|g' android/app/src/main/res/values/strings.xml

          npx cap sync android

          sed -i -E 's/minSdkVersion\s*=\s*[0-9]+/minSdkVersion = 24/g' android/variables.gradle
          sed -i -E 's/minSdkVersion\s+rootProject\.ext\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle

      - name: Decode keystore strictly from GitHub Secrets
        run: |
          rm -f android/app/jaknooma-release-key.jks
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/jaknooma-release-key.jks

      - name: Verify keystore SHA1
        run: |
          keytool -list -v -keystore android/app/jaknooma-release-key.jks -storepass "${{ secrets.KEYSTORE_PASSWORD }}" | grep -E "Alias|SHA1"

      - name: Build & Explicitly Sign AAB with Correct Keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          VERSION_CODE=$((40 + ${{ github.run_number }}))

          sed -i -E "s/versionCode\s+[0-9]+/versionCode $VERSION_CODE/g" android/app/build.gradle
          sed -i -E "s/versionName\s+\"[^\"]+\"/versionName \"1.0.$VERSION_CODE\"/g" android/app/build.gradle

          cd android
          ./gradlew bundleRelease assembleRelease

          # توقيع ملف الـ AAB مباشرة بأداة jarsigner الرسمية لضمان استخدام مفتاح 24:2C بنسبة 100%
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore app/jaknooma-release-key.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_PATH" "$KEY_ALIAS"

          echo "=== التحقق من بصمة ملف الـ AAB النهائي ==="
          keytool -printcert -jarfile "$AAB_PATH" | grep -E "Owner|SHA1"

          # إعادة تسمية الملف برقم العملية حتى لا يختلط مع أي ملف قديم في كمبيوترك
          cp "$AAB_PATH" "app/build/outputs/bundle/release/jaknooma-signed-run-${{ github.run_number }}.aab"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jaknooma-ready-for-playstore-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/jaknooma-signed-run-*.aab
