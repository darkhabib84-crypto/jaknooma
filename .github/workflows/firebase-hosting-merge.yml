name: Deploy to Firebase Hosting on Merge
on:
  push:
    branches:
      - main # أو master حسب اسم الفرع الرئيسي عندك
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install && npm run build
      
      # 1. نشر الموقع (Hosting) كما هو
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: jaknooma

      # 2. نشر قواعد التخزين (Storage Rules) لتفعيل الصور فوراً
      - name: Deploy Storage Rules to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > ./service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="./service-account.json"
          npx firebase-tools deploy --only storage --project jaknooma
