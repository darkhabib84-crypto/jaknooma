name: Build Android App Automatically

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً متى شئت من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web project
        run: npm run build

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize Android platform if missing
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generate Release Keystore Automatically
        run: |
          cd android/app
          # توليد مفتاح توقيع تلقائياً برمجياً لكي يتم توقيع التطبيق به
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias jaknooma-alias -storepass jaknooma123 -keypass jaknooma123 -dname "CN=Jaknooma, OU=Dev, O=Jaknooma, L=City, S=State, C=US"
          
          # تعديل ملف build.gradle لتضمين التوقيع أوتوماتيكياً
          echo "
          android {
              signingConfigs {
                  release {
                      storeFile file('release-key.jks')
                      storePassword 'jaknooma123'
                      keyAlias 'jaknooma-alias'
                      keyPassword 'jaknooma123'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          " >> build.gradle

      - name: Build Android App Bundle (AAB) & APK
        run: |
          cd android
          ./gradlew bundleRelease
          ./gradlew assembleRelease

      - name: Upload Signed AAB and APK
        uses: actions/upload-artifact@v4
        with:
          name: jaknooma-signed-builds
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
