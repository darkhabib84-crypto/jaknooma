workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor Android
        script: |
          npx cap add android
          npx cap sync android
      - name: Generate Keystore
        script: |
          mkdir -p keystores
          if [ ! -f "keystores/jaknooma-key.jks" ]; then
            keytool -genkey -v -keystore "keystores/jaknooma-key.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias jaknooma-alias -storepass "jaknooma123456" -keypass "jaknooma123456" -dname "CN=Jaknooma, OU=Dev, O=Jaknooma, L=Dubai, ST=Dubai, C=AE"
          fi
      - name: Update SDK & Configure Signing
        script: python3 -c 'import re, os, shutil; [open(f, "w").write(re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", open(f).read())))) for f in ["android/variables.gradle", "android/build.gradle"] if os.path.exists(f)]; os.path.exists("keystores/jaknooma-key.jks") and shutil.copy("keystores/jaknooma-key.jks", "android/app/jaknooma-key.jks"); gp = "android/app/build.gradle"; content = open(gp).read() if os.path.exists(gp) else ""; "signingConfigs" not in content and open(gp, "w").write(content.replace("android {", "android {\n    signingConfigs {\n        release {\n            storeFile file(\"jaknooma-key.jks\")\n            storePassword \"jaknooma123456\"\n            keyAlias \"jaknooma-alias\"\n            keyPassword \"jaknooma123456\"\n        }\n    }\n", 1).replace("release {", "release {\n            signingConfig signingConfigs.release", 1))'
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - keystores/*.jks

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
