workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor Android, Set API & Sign
        script: |
          npx cap add android
          npx cap sync android
          python3 -c '
          import re, os

          # 1. تحديث إعدادات SDK في variables.gradle بأمان
          var_path = "android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path, "r") as f:
                  content = f.read()
              content = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", content)
              content = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", content)
              content = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", content)
              with open(var_path, "w") as f:
                  f.write(content)

          # 2. حقن إعدادات التوقيع فقط إذا كانت متوفرة في بيئة Codemagic
          gradle_path = "android/app/build.gradle"
          keystore_path = os.environ.get("CM_KEYSTORE_PATH", "")
          if os.path.exists(gradle_path) and keystore_path:
              with open(gradle_path, "r") as f:
                  gradle_content = f.read()
              
              if "signingConfigs" not in gradle_content:
                  signing_block = f"""
    signingConfigs {{
        release {{
            storeFile file("{keystore_path}")
            storePassword "{os.environ.get("CM_KEYSTORE_PASSWORD", "")}"
            keyAlias "{os.environ.get("CM_KEYSTORE_ALIAS", "")}"
            keyPassword "{os.environ.get("CM_KEYSTORE_PRIVATE_KEY_PASSWORD", "")}"
        }}
    }}
                  """
                  gradle_content = gradle_content.replace("android {", "android {" + signing_block, 1)
                  gradle_content = gradle_content.replace("release {", "release {{\n            signingConfig signingConfigs.release", 1)
                  with open(gradle_path, "w") as f:
                      f.write(gradle_content)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
