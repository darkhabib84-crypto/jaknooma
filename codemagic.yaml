workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Setup Capacitor Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Generate Fixed Keystore & Export Certificate
        script: |
          mkdir -p keystores
          # توليد مفتاح ثابت وثابت بكلمة مرور ومعلومات دقيقة لكي لا يتغير أبداً
          if [ ! -f "keystores/jaknooma-key.jks" ]; then
            keytool -genkey -v -keystore "keystores/jaknooma-key.jks" -keyalg RSA -keysize 2048 -validity 10000 -alias jaknooma-alias -storepass "jaknooma123456" -keypass "jaknooma123456" -dname "CN=Jaknooma, OU=Dev, O=Jaknooma, L=Dubai, ST=Dubai, C=AE"
          fi
          # استخراج ملف الشهادة .pem لتقديمه لجوجل
          keytool -export -rfc -keystore "keystores/jaknooma-key.jks" -alias jaknooma-alias -storepass "jaknooma123456" -file "keystores/upload_certificate.pem"
      - name: Update SDK & Configure Signing Properly
        script: |
          python3 -c '
          import os, shutil, re

          var_path = "android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path, "r") as f:
                  c = f.read()
              c = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", c)
              c = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", c)
              c = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", c)
              open(var_path, "w").write(c)

          if os.path.exists("keystores/jaknooma-key.jks"):
              shutil.copy("keystores/jaknooma-key.jks", "android/app/jaknooma-key.jks")

          gp = "android/app/build.gradle"
          if os.path.exists(gp):
              with open(gp, "r") as f:
                  c = f.read()
              
              if "compileSdkVersion" not in c and "compileSdk " not in c:
                  c = c.replace("android {", "android {\n    compileSdkVersion 36\n    defaultConfig {\n        targetSdkVersion 36\n    }\n", 1)

              lb = chr(123)
              rb = chr(125)

              if "signingConfigs" not in c:
                  signing_block = "\n    signingConfigs " + lb + "\n        release " + lb + "\n            storeFile file(\"jaknooma-key.jks\")\n            storePassword \"jaknooma123456\"\n            keyAlias \"jaknooma-alias\"\n            keyPassword \"jaknooma123456\"\n        " + rb + "\n    " + rb + "\n"
                  c = c.replace("android " + lb, "android " + lb + signing_block, 1)

              if "signingConfig signingConfigs.release" not in c:
                  c = re.sub(r"(buildTypes\s*" + lb + r"[^}]*release\s*" + lb + r")", r"\1\n            signingConfig signingConfigs.release", c, flags=re.DOTALL)

              open(gp, "w").write(c)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - keystores/upload_certificate.pem

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
