workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Setup Capacitor Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Configure Permanent Keystore from Codemagic
        script: |
          python3 -c '
          import os, re

          # تحديث إعدادات الإصدار والـ SDK
          var_path = "android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path, "r") as f:
                  c = f.read()
              c = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", c)
              c = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", c)
              c = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", c)
              open(var_path, "w").write(c)

          # ربط ملف build.gradle بمفتاح Codemagic المحفوظ مسبقاً
          gp = "android/app/build.gradle"
          if os.path.exists(gp):
              with open(gp, "r") as f:
                  c = f.read()

              if "compileSdkVersion" not in c and "compileSdk " not in c:
                  c = c.replace("android {", "android {\n    compileSdkVersion 36\n    defaultConfig {\n        targetSdkVersion 36\n    }\n", 1)

              lb = chr(123)
              rb = chr(125)

              signing_block = "\n    signingConfigs " + lb + "\n        release " + lb + "\n            storeFile file(System.getenv(\"CM_KEYSTORE_PATH\") ?: \"\")\n            storePassword System.getenv(\"CM_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"CM_KEY_ALIAS\")\n            keyPassword System.getenv(\"CM_KEY_PASSWORD\")\n        " + rb + "\n    " + rb + "\n"

              if "signingConfigs" not in c:
                  c = c.replace("android " + lb, "android " + lb + signing_block, 1)

              if "signingConfig signingConfigs.release" not in c:
                  c = re.sub(r"(buildTypes\s*" + lb + r"[^}]*release\s*" + lb + r")", r"\1\n            signingConfig signingConfigs.release", c, flags=re.DOTALL)

              open(gp, "w").write(c)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic
    environment:
      node: lts
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.jaknooma.app
      vars:
        APP_STORE_APPLE_ID: 6815376945
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Ensure Capacitor iOS package
        script: |
          if [ ! -d "node_modules/@capacitor/ios" ]; then
            npm install @capacitor/ios@$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          fi
      - name: Setup Capacitor iOS
        script: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo "iOS project missing or incomplete, recreating it"
            if [ -d "ios" ]; then
              mv ios ios_partial_backup
            fi
            npx cap add ios --no-pod-install || npx cap add ios
            if [ -d "ios_partial_backup" ]; then
              cp -Rn ios_partial_backup/. ios/ || true
              rm -rf ios_partial_backup
            fi
          fi
          rm -f ios/App/Podfile.lock
          npx cap sync ios --no-pod-install || npx cap sync ios
          ls -la ios/App
      - name: Patch Podfile (privacy manifest versions)
        script: |
          python3 - <<'PY'
          import re
          p = "ios/App/Podfile"
          s = open(p).read()

          # رفع الحد الأدنى لنسخة الآيفون
          s = re.sub(r"platform :ios, '[0-9.]+'", "platform :ios, '15.0'", s)

          # حذف أي أسطر قديمة مثبتة لهذي المكتبات
          s = re.sub(r"^[ \t]*pod '(GoogleSignIn|GTMAppAuth|GTMSessionFetcher/Core)'.*\n", "", s, flags=re.M)

          marker = "# Add your Pods here"
          lines = []
          if "CapacitorFirebaseAuthentication/Google" not in s:
              lines.append("pod 'CapacitorFirebaseAuthentication/Google', :path => '../../node_modules/@capacitor-firebase/authentication'")
          lines += [
              "pod 'GoogleSignIn', '>= 7.1.0'",
              "pod 'GTMAppAuth', '>= 4.1.1'",
              "pod 'GTMSessionFetcher/Core', '>= 3.5.0'",
          ]

          if marker in s:
              s = s.replace(marker, marker + "".join("\n  " + l for l in lines), 1)
          else:
              print("WARNING: marker not found in Podfile")

          open(p, "w").write(s)
          PY
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/" ios/App/App.xcodeproj/project.pbxproj
          cat ios/App/Podfile
      - name: Install CocoaPods
        script: |
          cd ios/App
          rm -rf Podfile.lock Pods
          pod install --repo-update
      - name: Verify pod versions
        script: |
          grep -E "GoogleSignIn|GTMAppAuth|GTMSessionFetcher" ios/App/Podfile.lock || true
      - name: Set app icon
        script: |
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICON_DIR"
          cp AppIcon-1024.png "$ICON_DIR/AppIcon-512@2x.png"
          ls -la "$ICON_DIR"
          cat "$ICON_DIR/Contents.json"
      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 5)
          if [ -z "$LATEST_BUILD_NUMBER" ] || [ "$LATEST_BUILD_NUMBER" -lt 5 ]; then
            LATEST_BUILD_NUMBER=5
          fi
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "Setting iOS CURRENT_PROJECT_VERSION to $NEXT_BUILD_NUMBER (latest was $LATEST_BUILD_NUMBER)"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*;/CURRENT_PROJECT_VERSION = $NEXT_BUILD_NUMBER;/" ios/App/App.xcodeproj/project.pbxproj
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
