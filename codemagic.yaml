workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor Android, Set API & Sign
        script: |
          npx cap add android
          npx cap sync android
          python3 -c '
          import re, os
          for f in ["android/variables.gradle", "android/build.gradle"]:
              if os.path.exists(f):
                  c = open(f).read()
                  c = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", c)
                  c = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", c)
                  c = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", c)
                  open(f, "w").write(c)

          gf = "android/app/build.gradle"
          if os.path.exists(gf):
              c = open(gf).read()
              if "signingConfigs" not in c:
                  sc = "\n    signingConfigs {\n        release {\n            storeFile file(os.environ.get(\"CM_KEYSTORE_PATH\", \"\"))\n            storePassword os.environ.get(\"CM_KEYSTORE_PASSWORD\", \"\"))\n            keyAlias os.environ.get(\"CM_KEYSTORE_ALIAS\", \"\"))\n            keyPassword os.environ.get(\"CM_KEYSTORE_PRIVATE_KEY_PASSWORD\", \"\"))\n        }\n    }\n"
                  c = c.replace("android {", "android {" + sc, 1)
                  c = c.replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
                  open(gf, "w").write(c)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
