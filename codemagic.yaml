workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Auto-Generate Keystore, Set API & Sign
        script: |
          npx cap add android
          npx cap sync android
          
          mkdir -p keystores
          KEYSTORE_PATH="keystores/jaknooma-key.jks"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkey -v -keystore "$KEYSTORE_PATH" -keyalg RSA -keysize 2048 -validity 10000 -alias jaknooma-alias -storepass "jaknooma123456" -keypass "jaknooma123456" -dname "CN=Jaknooma, OU=Dev, O=Jaknooma, L=Dubai, ST=Dubai, C=AE"
          fi
          
          python3 - << 'EOF'
          import re, os, shutil

          var_path = "android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path, "r") as f:
                  content = f.read()
              content = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", content)
              content = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", content)
              content = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", content)
              with open(var_path, "w") as f:
                  f.write(content)

          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              if os.path.exists("keystores/jaknooma-key.jks"):
                  shutil.copy("keystores/jaknooma-key.jks", "android/app/jaknooma-key.jks")
              
              with open(gradle_path, "r") as f:
                  gradle_content = f.read()
              
              if "signingConfigs" not in gradle_content:
                  signing_block = """
    signingConfigs {
        release {
            storeFile file("jaknooma-key.jks")
            storePassword "jaknooma123456"
            keyAlias "jaknooma-alias"
            keyPassword "jaknooma123456"
        }
    }
                  """
                  gradle_content = gradle_content.replace("android {", "android {" + signing_block, 1)
                  gradle_content = gradle_content.replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
                  with open(gradle_path, "w") as f:
                      f.write(gradle_content)
          EOF
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
      - keystores/*.jks

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
