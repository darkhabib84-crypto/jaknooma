workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Setup Capacitor Android
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi
      - name: Configure Permanent Keystore from Codemagic
        script: |
          python3 -c '
          import os, re

          # تحديث إعدادات الإصدار والـ SDK
          var_path = "android/variables.gradle"
          if os.path.exists(var_path):
              with open(var_path, "r") as f:
                  c = f.read()
              c = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 24", c)
              c = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = 36", c)
              c = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = 36", c)
              open(var_path, "w").write(c)

          # ربط ملف build.gradle بمفتاح Codemagic المحفوظ مسبقاً
          gp = "android/app/build.gradle"
          if os.path.exists(gp):
              with open(gp, "r") as f:
                  c = f.read()
              
              if "compileSdkVersion" not in c and "compileSdk " not in c:
                  c = c.replace("android {", "android {\n    compileSdkVersion 36\n    defaultConfig {\n        targetSdkVersion 36\n    }\n", 1)

              lb = chr(123)
              rb = chr(125)

              signing_block = "\n    signingConfigs " + lb + "\n        release " + lb + "\n            storeFile file(System.getenv(\"CM_KEYSTORE_PATH\") ?: \"\")\n            storePassword System.getenv(\"CM_KEYSTORE_PASSWORD\")\n            keyAlias System.getenv(\"CM_KEY_ALIAS\")\n            keyPassword System.getenv(\"CM_KEY_PASSWORD\")\n        " + rb + "\n    " + rb + "\n"

              if "signingConfigs" not in c:
                  c = c.replace("android " + lb, "android " + lb + signing_block, 1)

              if "signingConfig signingConfigs.release" not in c:
                  c = re.sub(r"(buildTypes\s*" + lb + r"[^}]*release\s*" + lb + r")", r"\1\n            signingConfig signingConfigs.release", c, flags=re.DOTALL)

              open(gp, "w").write(c)
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
