workflows:
  jaknooma-android-workflow:
    name: Build Jaknooma Android App
    instance_type: mac_mini_m1
    environment:
      node: lts
      java: 17
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor Android & Set API Versions
        script: |
          npx cap add android
          npx cap sync android
          node -e '
            const fs = require("fs");
            ["android/variables.gradle", "android/build.gradle"].forEach(file => {
              if (fs.existsSync(file)) {
                let c = fs.readFileSync(file, "utf8");
                c = c.replace(/compileSdkVersion\s*(=|\s)\s*\d+/g, "compileSdkVersion = 36");
                c = c.replace(/targetSdkVersion\s*(=|\s)\s*\d+/g, "targetSdkVersion = 36");
                c = c.replace(/minSdkVersion\s*(=|\s)\s*\d+/g, "minSdkVersion = 24");
                fs.writeFileSync(file, c, "utf8");
              }
            });
          '
      - name: Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk

  jaknooma-ios-workflow:
    name: Build Jaknooma iOS App
    instance_type: mac_mini_m1
    environment:
      node: lts
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Initialize Capacitor iOS
        script: |
          npx cap add ios
          npx cap sync ios
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
